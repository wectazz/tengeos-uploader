name: Send ROM Release to Telegram
on:
  workflow_dispatch:

jobs:
  post_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Telegram Rich Message
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -euo pipefail

          HTML=$(cat <<EOF
          #duchamp #port #a17 #coloros
          <img src="https://i.ibb.co/bRb0QJtY/Frame-5.png" />
          <h1>ColorOS 17 Global | Port | Android 17</h1>
          <table bordered>
            <tr>
              <th colspan="2" align="center">Device</th>
            </tr>
            <tr>
              <td>Model</td><td>POCO X6 Pro / REDMI K70E</td>
            </tr>
            <tr>
              <td>Codename</td><td>Duchamp</td>
            </tr>
          </table>
          Released: 30/10/2026<br>
          Maintainer: @wectazz
          <details>
            <summary><code>About ROM</code></summary>
            <table bordered>
              <tr>
                <th colspan="2" align="center">Build information</th>
              </tr>
              <tr>
                <td>OS Version</td><td>ColorOS 17 Global</td>
              </tr>
              <tr>
                <td>Android</td><td>17</td>
              </tr>
              <tr>
                <td>Build Type</td><td>Non-Fenrir</td>
              </tr>
              <tr>
                <td>Flashing Type</td><td>Fastboot only</td>
              </tr>
            </table>
          </details>
          <details>
            <summary><code>Links</code></summary>
            <table bordered>
              <tr>
                <th colspan="2" align="center">Download</th>
              </tr>
              <tr>
                <td align="center"><a href="https://drive.google.com/file/d/1Kmqz3vonF4WPlQ2yGsjG3JK3ldlXJujK/view?usp=sharing">Link</a></td>
              </tr>
            </table>
            <ol>
              <li><a href="https://telegra.ph/How-to-flash-08-19">How to flash</a></li>
              <li><a href="https://telegra.ph/Changelog-10-29-17">Changelog</a></li>
              <li><a href="https://t.me/DuchampROM_screenshots/391">Screenshots</a></li>
              <li><a href="https://telegra.ph/Credits-10-24-12">Credits</a></li>
            </ol>
          </details>
          <details>
            <summary><code>Notes</code></summary>
            <ol>
              <li>Already with BakaSU with SuSFS v2.3.0</li>
              <li>Mi Cam added</li>
              <li>Use <a href="https://t.me/DuchampROM_screenshots/389">my own</a> preset in ViperFX (enable legacy mode)</li>
              <li>For DT2W use "DT2W Tool" app only!!</li>
              <li>U dont want battery drain? Disable aod</li>
              <li>Fastboot only</li>
            </ol>
          </details>
          <details>
            <summary><code>Bugs</code></summary>
            <ol>
              <li>Idk what about shutdown randomly, was not observed</li>
              <li>Autobrightness</li>
            </ol>
          </details>
          EOF
          )

          jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg html "$HTML" \
            '{
              chat_id: $chat_id,
              link_preview_options: {
                is_disabled: false,
                url: "https://i.ibb.co/bRb0QJtY/Frame-5.png",
                prefer_large_media: true
              },
              rich_message: {
                html: $html
              }
            }' > telegram_payload.json

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendRichMessage" \
            -H "Content-Type: application/json" \
            --data @telegram_payload.json
