name: Send ROM Release to Telegram
on:
  workflow_dispatch:

jobs:
  post_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Telegram Rich Message
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -euo pipefail

          HTML=$(cat <<EOF
          #duchamp #port #a17 #hyperos #fenrir
          <img src="https://i.ibb.co/GvtW8bTQ/Frame-2-1.png" />
          <h1>FluidOS 4.0.5.0 China | FENRIR / NON-FENRIR | Port | Android 17</h1>
          <table bordered>
            <tr>
              <th colspan="2" align="center">Device</th>
            </tr>
            <tr>
              <td>Model</td><td>POCO X6 Pro / REDMI K70E</td>
            </tr>
            <tr>
              <td>Codename</td><td>Duchamp</td>
            </tr>
          </table>
          Released: 25/11/2026<br>
          Maintainer: @wectazz
          <details>
            <summary><code>About ROM</code></summary>
            <table bordered>
              <tr>
                <th colspan="2" align="center">Build information</th>
              </tr>
              <tr>
                <td>OS Version</td><td>FluidOS 4.0.5.0.XPTCNXM</td>
              </tr>
              <tr>
                <td>Base Port</td><td>Xiaomi 17T</td>
              </tr>
              <tr>
                <td>Android</td><td>17</td>
              </tr>
              <tr>
                <td>Build Type</td><td>Fenrir / Non-Fenrir</td>
              </tr>
              <tr>
                <td>Flashing Type</td><td>Hybrid (recovery/fastboot)</td>
              </tr>
            </table>
          </details>
          <details>
            <summary><code>Links</code></summary>
            <table bordered>
              <tr>
                <th colspan="2" align="center">Download</th>
              </tr>
              <tr>
                <td align="center"><a href="https://pixeldrain.com/u/qT9rQYNK">Fenrir (Pixeldrain)</a></td>
                <td align="center"><a href="https://pixeldrain.com/u/4ZBjjMHG">Non-Fenrir (Pixeldrain)</a></td>
              </tr>
              <tr>
                <td align="center"><a href="https://gofile.io/d/ig9ur94a">Fenrir (Gofile)</a></td>
                <td align="center"><a href="https://gofile.io/d/3nX4jktp">Non-Fenrir (Gofile)</a></td>
              </tr>
            </table>
            <ol>
              <li><a href="https://telegra.ph/How-to-flash-11-25">How to flash</a></li>
              <li><a href="https://telegra.ph/Changelog-11-25-7">Changelog</a></li>
              <li><a href="https://t.me/DuchampROM_screenshots/410">Screenshots</a></li>
              <li><a href="https://telegra.ph/Credits-11-25-17">Credits</a></li>
            </ol>
          </details>
          <details>
            <summary><code>Notes</code></summary>
            <ol>
              <li><u>CLEAN FLASH ONLY FOR FENRIR!</u></li>
              <li>Fullscreen aod fixed</li>
              <li>To Reduce cpu clamping and cpusets, use <a href="https://t.me/DuchampROM_screenshots/343">this</a></li>
              <li>Use <a href="https://t.me/DuchampROM_screenshots/449">this</a> guide to get strong on fenrir (cuz ports problem)</li>
              <li>Use <a href="https://t.me/DuchampROM_screenshots/448">this</a> guide to get strong on non-fenrir</li>
              <li>Both builds pre-rooted with GKI BakaSU (susfs v2.4.0)</li>
            </ol>
          </details>
          <details>
            <summary><code>Bugs</code></summary>
            <ol>
              <li>Nothing</li>
            </ol>
          </details>
          EOF
          )

          jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg html "$HTML" \
            '{
              chat_id: $chat_id,
              link_preview_options: {
                is_disabled: false,
                url: "https://i.ibb.co/GvtW8bTQ/Frame-2-1.png",
                prefer_large_media: true
              },
              rich_message: {
                html: $html
              }
            }' > telegram_payload.json

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendRichMessage" \
            -H "Content-Type: application/json" \
            --data @telegram_payload.json
